name: AI code review

# Reviews pull requests for readability, reusability and code quality, and comments on the PR.
# Needs a repository secret named ANTHROPIC_API_KEY (Settings > Secrets and variables > Actions).
# Without the secret the job is skipped. Pull requests from forks never receive secrets, so they are skipped too.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Check for API key
        id: key
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "ANTHROPIC_API_KEY not set; skipping AI review."; fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        if: steps.key.outputs.present == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            This repository is MoldMaker, a Python add-in for Autodesk Fusion. Rules of the project:
            - Standard library only; core/ and strategies/ must never `import adsk` (only fusion/ and commands/ may).
            - Units: presets are mm/degrees; conversion to Fusion's cm happens only in core/units.py.
            - Strategies plan with pure functions and build through the adapter interface, so they can be tested with tests/fake_adapter.py.
            Review only the changed lines, and comment on:
            1. Readability: naming, function length and nesting, comments that explain why.
            2. Reusability: duplicated logic that belongs in core/ or strategies/common.py, hard-coded values that belong in presets or MoldParams.
            3. Code quality: error handling, edge cases, missing or weak tests, violations of the project rules above.
            Be concrete: give the file and line, and a suggested change. Skip nitpicks. Post one summary comment, plus inline comments for the important points.
            If everything looks good, say so briefly.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
